name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: REASONS canvas lint
        run: bash scripts/reasons-lint.sh

      - name: Harness sensors
        run: |
          git fetch --no-tags --depth=200 origin main
          bash scripts/safeguards-quality.sh
          bash scripts/no-prisma-in-routes.sh
          bash scripts/agent-boundary-check.sh

      - name: Install APM
        run: |
          curl -sSL https://aka.ms/apm-unix | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: APM drift audit
        run: apm --version && bash scripts/apm-audit.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: cd api && pnpm exec prisma generate

      - name: Push database schema (test DB)
        run: cd api && pnpm exec prisma db push
        env:
          DATABASE_URL: file:../database/workshophub-ci.sqlite?connection_limit=1

      - name: Seed database
        run: cd api && pnpm exec prisma db seed
        env:
          DATABASE_URL: file:../database/workshophub-ci.sqlite?connection_limit=1

      - name: Run tests
        run: pnpm run test
        env:
          DATABASE_URL: file:../database/workshophub-ci.sqlite?connection_limit=1
          # Note: DATABASE_URL is relative to api/prisma/schema.prisma
          # file:../database/X resolves to api/database/X

      - name: Run lint
        run: pnpm run lint

      - name: Run format check
        run: pnpm run format-check
