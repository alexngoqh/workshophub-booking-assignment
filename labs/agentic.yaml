# Bonus 3: go agentic.
# Instead of reading one text reply, run the real OpenCode test-writer agent with tools on a
# throwaway copy of a mini repo and assert on WHAT IT DID (its tool calls), not what it said.
# Hard rules under test (.apm/agents/test-writer.agent.md):
#   - writes only under api/tests/
#   - never reads api/src/
#
# Run:  make eval-agentic   (needs GOOGLE_API_KEY)
# The target pins opencode-ai + @opencode-ai/sdk to 1.19.6 (a 2.x binary never prints the
# "opencode server listening" line the 1.x SDK waits for) and gives OpenCode its own data dirs
# under output/ (otherwise 1.x fails with "Database is not empty and has no session table" on
# the database a global OpenCode 2.x created).
# Not part of `make eval` / CI: it is slow, costs more, and needs the opencode binary.

prompts:
  - |
    Packet for ONE slice (RED step only):
    AC: cancelling a confirmed registration returns 200 and frees a seat
    (TrainingSession.registered decreases by 1 when nobody is waitlisted).
    Endpoint: POST /registrations/:id/cancel. Use createTestSession() from
    api/tests/integration/helpers.ts. Write the failing integration test.

providers:
  - id: opencode:sdk
    config:
      working_dir: ./fixtures/agentic-repo
      copy_working_dir: true # each test gets a temp copy; the real repo is never touched
      agent: test-writer
      # promptfoo enables only read-only tools by default (read/grep/glob/list). Turn on the
      # edit tool (write/edit share one switch); the agent's own permissions still limit
      # writes to api/tests/**, and the assertion checks it never tried anything else.
      tools:
        edit: true
      provider_id: google
      model: '{{env.AGENTIC_MODEL | default("gemini-3.8-flash")}}'
      timeout: 300000

tests:
  - description: test-writer stays inside its sandbox
    assert:
      - type: javascript
        value: file://../lib/assertToolCalls.js
